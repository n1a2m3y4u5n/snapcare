app = "snapcare"
primary_region = "nrt"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

# 서버 영속 저장소 (Supabase 대체) — 파일 저장을 fly 볼륨에 유지
[env]
  SNAPCARE_DATA_DIR = "/data"

[[mounts]]
  source = "snapcare_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
