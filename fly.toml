app = "snapcare"
primary_region = "nrt"

# 약통 사서함 주소.
#
# **빌드 인자**로 넣는다. `NEXT_PUBLIC_` 이 붙은 값은 Next 가 묶는 시점에 브라우저
# 코드 안으로 박아 넣으므로, 아래 [env] 처럼 실행할 때 주는 것으로는 폰까지 닿지
# 않는다. 그때 나타나는 모습이 고약하다 — 서버(미들웨어)는 주소를 알아서 CSP 를
# 열어 주는데 화면은 localhost 로 붙으러 가고, 짝짓기가 "코드가 틀렸습니다" 로
# 실패한다. 라벨을 다시 읽는 사람이 생긴다.
#
# 그래서 여기 적어 둔다. 이러면 `fly deploy` 만 쳐도 맞게 나간다 — 플래그를 기억해야
# 하는 배포는 언젠가 잊는 배포다. 다른 릴레이로 보내려면 --build-arg 로 덮어쓴다.
[build]
  [build.args]
    NEXT_PUBLIC_SNAPCARE_RELAY = "https://snapcare-relay.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  # 발송 기간에는 멈추지 않게 한다.
  #
  # min_machines_running = 1 만으로는 부족했다. 배포 직후 기계가 stopped 상태였고 첫
  # 요청이 6.4초 걸렸다 — 그 값은 트래픽이 있을 때 유지할 최소 대수이고, 멈춘 상태에서
  # 시작시키는 것은 아니다. "off" 로 두면 아예 멈추지 않는다.
  auto_stop_machines = "off"
  auto_start_machines = true
  # 발송 기간에는 한 대를 계속 켜 둔다.
  #
  # 0 이면 요청이 없을 때 기계가 멈추고, 다시 깨어나는 데 6.7초가 걸린다(실측). 모르는
  # 사람이 보낸 메일의 링크를 눌렀는데 7초 동안 흰 화면이면 상당수가 그대로 닫는다.
  # 1103통을 보내 놓고 그 자리에서 잃는 것이므로, 기계 한 대 값이 훨씬 싸다.
  #
  # 조사가 끝나면 0 으로 되돌린다.
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

# 서버 영속 저장소 (Supabase 대체) — 파일 저장을 fly 볼륨에 유지
[env]
  SNAPCARE_DATA_DIR = "/data"

[[mounts]]
  source = "snapcare_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
