# Config for the Nutrition5k RGB-only nutrition regression model (v1).
# All paths are relative to nutrition_manager/ (see common.py).

dataset_root: nutrition5k_dataset

# Where overhead RGB frames live: <dataset_root>/<imagery_subdir>/<dish_id>/<rgb_filename>
imagery_subdir: imagery/realsense_overhead
rgb_filename: rgb.png

# Official Nutrition5k RGB split id lists (relative to dataset_root).
splits:
  train: dish_ids/splits/rgb_train_ids.txt
  test: dish_ids/splits/rgb_test_ids.txt

# Dish-level ground truth. Only the first 6 CSV fields are used:
# dish_id, calories, mass, fat, carb, protein  (the rest is per-ingredient data).
metadata_csvs:
  - metadata/dish_metadata_cafe1.csv
  - metadata/dish_metadata_cafe2.csv

# The five regression targets, in the order expected by the official
# compute_eval_statistics.py (calories, mass, fat, carb, protein).
targets: [calories, mass, fat, carb, protein]

# Built by data/build_labels.py (relative to nutrition_manager/).
labels_csv: data/labels.csv

# Multi-view manifest built by build_dataset.py (overhead + side-angle frames).
# train.py/eval.py use this when present, else fall back to labels_csv.
manifest_csv: dataset_processed/manifest.csv

model:
  backbone: convnext_tiny     # any timm model name (efficientnet_b0, resnet50, ...)
  img_size: 224
  dropout: 0.2

train:
  epochs: 12
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 0.05
  val_frac: 0.1            # fraction of train *dishes* held out for validation
  seed: 42
  num_workers: 12
  amp: true                # mixed precision (recommended on the RTX 3060)
  checkpoint_dir: checkpoints

  # --- target handling -----------------------------------------------------
  # `identity` standardizes raw physical units; `log1p` standardizes log(1+y).
  # identity is the space the official metric lives in (MAE% is a ratio of
  # sums, so it rewards absolute accuracy), which is why it is the default.
  target_space: identity
  # Fit the mean/std below this percentile. The targets carry a few extreme
  # labels — carb reaches 845 g against a 99th percentile of 68 g — and without
  # this they set the scale for the standardization of every other dish.
  # The samples themselves are NOT clipped, only the statistics.
  clip_percentile: 99.5
  # A little noise on the standardized target, matched to the fact that
  # Nutrition5k's own weights are measured, not exact.
  label_noise: 0.0

  # --- sampling ------------------------------------------------------------
  # The manifest is 97% side-angle frames but the test split is overhead only.
  # Draw overhead frames this often so the scored view is actually trained on.
  overhead_ratio: 0.5
  # One "epoch" is this many draws with replacement, so epoch cost is constant
  # regardless of how many frames build_dataset.py happened to extract.
  epoch_size: 24000

  # --- optimisation --------------------------------------------------------
  warmup_epochs: 1
  min_lr_factor: 0.01      # cosine floor as a fraction of lr
  loss_beta: 1.0           # SmoothL1 transition, in standardized units
  grad_clip: 1.0
  ema_decay: 0.999         # null to disable the weight average

# Test-time augmentation used by eval.py / predict.py. Each listed transform
# is run and the predictions are averaged. `none` alone reproduces v1.
tta: [none, hflip]
